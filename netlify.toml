[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

[build.environment]
  # Optional: set your public URL so canonical/Open Graph URLs and the sitemap
  # use your custom domain. Netlify's own $URL is used when this is unset.
  # SITE_URL = "https://www.example.com"

# Netlify serves /404.html automatically for unknown paths.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Static assets carry a content hash in their URL (?v=...), so they can be
# cached for a year.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
